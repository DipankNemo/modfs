# Module catalogue for the combination harness.
#
# Selection is ADVERSARIAL, not representative (ARCHITECTURE section 6):
# modules are here to provoke conflict classes, not to model real use cases.
# Everything is kept small because the evaluation builds all pairs and
# triples -- build time and disk dominate, not realism.
#
# Fields
#   name      module name; artefact becomes $MOD_DIR/<name>.sqsh
#   packages  what apt is asked to install (the "requested" set)
#   probe     shell command run INSIDE the composed chroot by 07_smoke_test.sh.
#             Must exit 0 when the module works. Keep it cheap and offline.
#   provokes  which conflict class this module exists to exercise
#   note      why it is here, when that is not obvious
#   version   module version, used by module-level `requires` constraints
#   provides  module-level capabilities this module offers
#   requires  module-level dependencies: [{module: NAME, constraint: ">= V"}]
#   conflicts module-level exclusions: [{module: NAME}]
#   snapshot  build from a DIFFERENT archive snapshot (positive control only)
#   post_install  shell command run in the chroot after apt, for deliberately
#             non-dpkg installs
#
# Probes avoid commands that exit non-zero on success: `nc -h` prints usage
# and exits 1, so those modules probe with `command -v` instead.

defaults:
  version: "1.0"
  parent: base

modules:

  # ---- adversarial: alternatives on the same generic name ----------------
  - name: vim
    packages: [vim]
    probe: 'vim --version >/dev/null && printf "x\n" > /tmp/vimtest && vim -es -u NONE -c "%s/x/ok/" -c wq /tmp/vimtest && grep -qx ok /tmp/vimtest && update-alternatives --list editor | grep -q /usr/bin/vim'
    provokes: alternatives
    note: registers /usr/bin/editor. Pair with emacs.

  - name: emacs
    packages: [emacs-nox]
    probe: 'emacs --batch --eval "(princ (emacs-version))" >/dev/null 2>&1 && update-alternatives --list editor | grep -q /usr/bin/emacs'
    provokes: alternatives
    note: >
      also registers /usr/bin/editor. The classic alternatives collision.
      Deliberately the largest module in the catalogue and the one most
      likely to exceed MODULE_MAX_MB -- that is a measurement, not a bug.

  - name: gawk
    packages: [gawk]
    probe: 'gawk "BEGIN{print substr(\"modfs\",1,5)}" | grep -qx modfs && update-alternatives --list awk | grep -q /usr/bin/gawk'
    provokes: alternatives
    note: second awk provider; base already ships mawk.
    probe_note: >
      satisfied by a sibling. `mysql` pulls in the gawk package as a
      dependency and ships /usr/bin/gawk (704 984 B, identical), so in
      `gawk + mysql` BOTH halves of this probe pass on mysql's copy --
      the binary and the alternatives registration. Benign class-1
      overlap, so the composed system is correct; the probe just stops
      being evidence about THIS module. Same shape as pgclient/postgres.

  - name: original-awk
    packages: [original-awk]
    probe: 'original-awk "BEGIN{print \"ok\"}" | grep -qx ok && update-alternatives --list awk | grep -q /usr/bin/original-awk'
    provokes: alternatives
    note: third awk provider. gawk+original-awk is a two-module collision
          over a link group base already owns.

  # ---- adversarial: diversions and Replaces ------------------------------
  - name: nc-openbsd
    packages: [netcat-openbsd]
    probe: '/bin/nc.openbsd -h 2>&1 | grep -q OpenBSD'
    provokes: diversions
    note: pair with nc-traditional; both own /bin/nc.

  - name: nc-traditional
    packages: [netcat-traditional]
    probe: '/bin/nc.traditional -h 2>&1 | grep -qi "connect to somewhere"'
    provokes: diversions

  # ---- adversarial: runtime resource conflict ----------------------------
  - name: webserver
    packages: [nginx]
    probe: 'nginx -t && nginx -T >/dev/null'
    provokes: runtime-port
    note: pair with apache. Both claim port 80.

  - name: apache
    packages: [apache2]
    probe: 'apache2ctl configtest && apache2ctl -t -D DUMP_MODULES 2>/dev/null | grep -q mpm_'
    provokes: runtime-port
    note: >
      composes cleanly and passes every static check -- the collision is
      outside dpkg's model entirely and only a boot test can see it. That
      negative result is the point.

  # ---- adversarial: two providers of one virtual package -----------------
  - name: mta-msmtp
    packages: [msmtp-mta]
    probe: 'msmtp --version >/dev/null && readlink -f /usr/sbin/sendmail | grep -q msmtp'
    provokes: virtual-provider
    note: Provides mail-transport-agent.

  - name: mta-nullmailer
    packages: [nullmailer]
    probe: 'test -x /usr/sbin/sendmail && test -x /usr/sbin/nullmailer-send && test -x /usr/sbin/nullmailer-queue && dpkg -S /usr/sbin/sendmail | grep -q "^nullmailer:"'
    probe_note: >
      presence and ownership, not function. nullmailer's sendmail queues mail
      for a daemon that cannot run in a chroot, so there is no offline
      functional test. It does require the three binaries to EXIST, which the
      previous version did not: its verdict came from `dpkg -S` alone, after a
      `;` that discarded the functional half.
    provokes: virtual-provider
    note: >
      also Provides mail-transport-agent. Worth watching: C4 in 05_check.sh
      matches Conflicts against REAL package names, so a conflict declared
      only through a virtual name may slip past it. If this pair is accepted
      statically, that is a gap in the checker, not a clean composition.

  # ---- class 6 provocation ------------------------------------------------
  - name: pytools
    packages: [python3-numpy, python3-pip]
    probe: 'python3 -c "import numpy; assert round(numpy.linalg.det(numpy.eye(3)))==1" && pip3 --version >/dev/null'
    provokes: base-upgrade
    note: >
      the original class-6 case: numpy -> liblapack3 -> libgfortran5 ->
      gcc-12-base with an exact-equality dependency. Should now report 0
      upgrades because base is full-upgraded.

  - name: pyyaml
    packages: [python3-yaml]
    probe: 'python3 -c "import yaml; assert yaml.safe_load(\"a: 1\")=={\"a\":1}"'
    provokes: benign-overlap
    note: shares the python3 dependency cone with pytools.

  # ---- production-scale modules -------------------------------------------
  # Added after UID range partitioning was in place, so nothing needed
  # rebuilding twice. These are the first modules in the catalogue chosen for
  # SIZE and REALISM rather than to provoke a class.
  - name: gcc
    packages: [build-essential]
    probe: '{ echo "#include <cstdio>"; echo "int main(){std::printf(\"1\");return 0;}"; } > /tmp/gp.cc && g++ -o /tmp/gpp /tmp/gp.cc && /tmp/gpp | grep -qx 1 && make --version >/dev/null'
    probe_note: >-
      Uses g++ and make, which are UNIQUE to this module. The previous probe
      ran , and rust pulls in gcc-11 and cc1 as build dependencies, so it
      passed with this module absent. Measured 2026-09-19: gcc contributes 16
      packages rust does not, including g++, g++-11, make, dpkg-dev and
      build-essential, so a C++ compile plus make cannot be satisfied by rust.
    provokes: scale
    probe_note: >
      satisfied by a sibling. `rust` pulls in gcc-11 AND cc1 as build
      dependencies, so in `gcc + rust` this probe compiles and runs using
      rust's copy of the toolchain. Class-1 benign overlap.

  - name: java
    packages: [default-jdk-headless]
    probe: 'cd /tmp && printf "public class H{public static void main(String[] a){System.out.print(1);}}" > H.java && javac H.java && java H | grep -qx 1'
    provokes: scale
  - name: rust
    packages: [rustc, cargo]
    probe: 'printf "fn main(){}" > /tmp/p.rs && rustc -o /tmp/pr /tmp/p.rs && /tmp/pr && cargo --version >/dev/null'
    provokes: shared-toolchain
    note: pair with llvm; both pull large parts of the LLVM runtime.
  - name: llvm
    packages: [llvm, clang]
    probe: 'printf "int main(){return 0;}" > /tmp/l.c && clang -c -o /tmp/l.o /tmp/l.c && llvm-nm /tmp/l.o | grep -q main'
    provokes: shared-toolchain
  - name: postgres
    packages: [postgresql]
    probe: '/usr/lib/postgresql/14/bin/postgres --version >/dev/null && getent passwd postgres >/dev/null && [ "$(stat -c %U /var/lib/postgresql)" = postgres ]'
    provokes: service-account
    note: allocates a system account; with ranges in place it must not collide.
  - name: mysql
    packages: [mariadb-server]
    probe: 'mariadbd --version >/dev/null && getent passwd mysql >/dev/null && [ "$(stat -c %U /var/lib/mysql)" = mysql ]'
    provokes: service-account
  - name: docker
    packages: [docker.io]
    probe: 'dockerd --version >/dev/null && command -v containerd >/dev/null && command -v runc >/dev/null && getent group docker >/dev/null'
    provokes: service-account

  # ---- module-level dependency exercise -----------------------------------
  # Deliberately fake. Real CUDA is not usable here: it lives in NVIDIA's
  # repository, which has no snapshot service, so it cannot be pinned; it is
  # 3-4 GB against a 256 MB catalogue; and its driver is a DKMS kernel module
  # while base ships no kernel. These two carry the module-level relationship
  # without any of that, which is the part being tested.
  - name: fake-nvidia-driver
    packages: [hello]
    version: "550"
    provides: [nvidia-driver]
    probe: 'hello | grep -qi hello'
    provokes: module-dependency
  - name: fake-cuda
    packages: [sl]
    requires:
      - module: nvidia-driver
        constraint: ">= 550"
    probe: 'test -x /usr/games/sl'
    provokes: module-dependency
    note: >
      must REJECT alone (unsatisfied requirement) and ACCEPT with
      fake-nvidia-driver. Exercises requires/provides, which existed in the
      manifest schema for weeks without being enforced.

  # ---- measuring the blindness --------------------------------------------
  - name: pipdemo
    packages: [python3-pip]
    post_install: pip3 install --no-cache-dir --break-system-packages requests || pip3 install --no-cache-dir requests
    probe: python3 -c "import requests"
    provokes: dpkg-blindness
    note: >
      installs a Python package OUTSIDE dpkg. Every check in this project
      reads dpkg metadata, so nothing sees these files: the manifest package
      count and the sidecar path count both exclude them. Turns an argued
      limitation into a measured one. TensorFlow was rejected for the same
      reason at a size that would have dominated the catalogue.

  # ---- positive control ---------------------------------------------------
  - name: control-oldsnap
    packages: [curl]
    snapshot: "20250401T000000Z"
    probe: curl --version
    probe_note: >-
      PROBE DELIBERATELY WEAK and unfixable. This module exists to be REJECT
      ED at tier 1, so any functional probe would only ever run in a known-n
      egative observation. `curl --version` is honest about proving nothing.
    provokes: positive-control
    note: >
      Deliberately built from a DIFFERENT archive snapshot to the rest of the
      catalogue. It MUST be rejected against every sibling: the precondition
      check sees the snapshot mismatch, and against the `curl` module it also
      trips class 2, because curl is 7.81.0-1ubuntu1.20 here and
      7.81.0-1ubuntu1.24 at the pinned snapshot.
      Its purpose is to make the sweep self-validating. An all-ACCEPT result
      is weak evidence unless the run can be shown to be capable of
      rejecting; this module is the known-bad that proves it. If a sweep ever
      reports control-oldsnap as composable, the sweep is broken, not clean.

  # ---- benign overlap and general filler ---------------------------------
  - name: curl
    packages: [curl]
    probe: 'curl -sS file:///etc/hostname | grep -q .'
    provokes: benign-overlap
  - name: wget
    packages: [wget]
    probe: wget --version
    probe_note: >-
      PROBE DELIBERATELY WEAK. wget has no file:// scheme, so there is no of
      fline functional probe; every real transfer needs a network the build 
      and the boot test both deny. Recorded rather than hidden: this probe p
      roves the binary loads, not that wget works.
    provokes: benign-overlap
  - name: git
    packages: [git]
    probe: 'cd /tmp && rm -rf g && git init -q g && cd g && git -c user.email=a@b -c user.name=c commit -q --allow-empty -m x && git log --oneline | grep -q x'
    provokes: benign-overlap
  - name: jq
    packages: [jq]
    probe: 'echo "{\"a\":1}" | jq -e ".a==1" >/dev/null'
    provokes: benign-overlap
  - name: rsync
    packages: [rsync]
    probe: 'printf data > /tmp/r1 && rsync /tmp/r1 /tmp/r2 && cmp /tmp/r1 /tmp/r2'
    provokes: benign-overlap
    probe_note: >
      satisfied by a sibling. `mysql` ships /usr/bin/rsync (534 624 B,
      identical) as a dependency, so `rsync + mysql` passes this probe on
      mysql's copy. Class-1 benign overlap.

  - name: tmux
    packages: [tmux]
    probe: 'tmux -f /dev/null new-session -d -s modfs "sleep 30" && tmux -f /dev/null list-sessions | grep -q "^modfs:" && r=0 || r=1; tmux -f /dev/null kill-server 2>/dev/null; exit $r'
    provokes: benign-overlap
  - name: htop
    packages: [htop]
    probe: htop --version
    probe_note: >-
      PROBE DELIBERATELY WEAK. htop has no batch or one-shot mode, so there 
      is nothing to execute non-interactively. The probe proves the ELF load
      s and its libraries resolve, and nothing more.
    provokes: benign-overlap
  - name: socat
    packages: [socat]
    probe: 'printf data > /tmp/s1 && socat -u FILE:/tmp/s1 CREATE:/tmp/s2 && cmp /tmp/s1 /tmp/s2'
    provokes: benign-overlap
    probe_note: >
      satisfied by a sibling. `mysql` ships /usr/bin/socat (392 824 B,
      identical) as a dependency, so `socat + mysql` passes this probe on
      mysql's copy. Class-1 benign overlap.

  - name: zstd
    packages: [zstd]
    probe: >-
      d=$(mktemp -d /tmp/modfs-zstd.XXXXXX) || exit 1;
      trap 'rm -f "$d/input" "$d/compressed" "$d/output"; rmdir "$d"' EXIT;
      printf data > "$d/input" && zstd -q -o "$d/compressed" "$d/input" &&
      zstd -dq -o "$d/output" "$d/compressed" && cmp "$d/input" "$d/output"
    provokes: benign-overlap
  - name: sqlite
    packages: [sqlite3]
    probe: 'sqlite3 :memory: "create table t(a);insert into t values(1);select a from t;" | grep -qx 1'
    provokes: benign-overlap
  - name: tcpdump
    packages: [tcpdump]
    probe: 'tcpdump --version >/dev/null 2>&1 && getent passwd tcpdump >/dev/null'
    provokes: benign-overlap
  - name: dnsutils
    packages: [bind9-dnsutils]
    probe: 'dig -v 2>&1 | grep -qi dig && dig -f /dev/null >/dev/null 2>&1'
    provokes: benign-overlap
  - name: pgclient
    packages: [postgresql-client]
    probe: psql --version
    probe_note: >-
      PROBE DELIBERATELY WEAK. psql cannot do useful work without a server t
      o connect to, and this module deliberately ships no server. Note this 
      probe was IDENTICAL to postgres' until 2026-09-18, which made postgres
       a demonstrated false positive: psql comes from postgresql-client, whi
      ch both modules carry.
    provokes: benign-overlap
  - name: redis
    packages: [redis-server]
    probe: 'redis-server --version >/dev/null && getent passwd redis >/dev/null && [ "$(stat -c %U /var/lib/redis)" = redis ]'
    provokes: runtime-port
    note: claims 6379; pair with memcached for a non-colliding control.
  - name: memcached
    packages: [memcached]
    probe: 'memcached --version >/dev/null && getent passwd memcache >/dev/null'
    provokes: benign-overlap

  # ---- the real GPU stack ------------------------------------------------
  # These two are NOT adversarial and NOT small. They exist to answer a
  # different question from the rest of the catalogue: does the delta method
  # survive a module two orders of magnitude larger than its median? Their
  # effect on the storage ratios is a RESULT, not a regression -- see
  # ARCHITECTURE section 7, "Storage depends on the catalogue".
  #
  # ABI PINNING. linux-objects-nvidia-535-5.15.0-185-generic names a kernel
  # ABI in its package name, so this module is valid against exactly one
  # kernel: the one 11_boot_test.sh installs at pack time from the same
  # pinned snapshot. That is recorded in each run bundle's kernel.json since
  # 2026-09-19. It cannot be expressed as a module-level `requires`, because
  # the kernel is image scaffolding and is not a module.
  - name: nvidia-driver-535
    version: "535.309.01"
    packages:
      - linux-objects-nvidia-535-5.15.0-185-generic
      - nvidia-kernel-common-535
      - libnvidia-compute-535
      - nvidia-utils-535
    # Link the .ko from Canonical's prebuilt objects, then put them where the
    # signed path would have put them. BUILD's `unsigned` mode sets
    # signed_only=: so that `: cat x.ko x.ko.sig > ../x.ko` becomes a no-op
    # COMMAND -- but the shell still performs the REDIRECT, so it leaves a
    # zero-byte .ko at exactly the path depmod scans. Ubuntu's own script;
    # found by looking, not by assuming. The copy-up below is what the signed
    # branch does, minus the signature, and the intermediates removed are
    # exactly the ones Canonical's CLEAN lists.
    post_install: 'set -e; abi=5.15.0-185-generic; test -L /lib || { echo "FATAL: /lib is not a symlink -- a real lib/ directory was created"; exit 1; }; d="/usr/lib/modules/$abi/kernel/nvidia-535"; test -d "$d/bits" || { echo "FATAL: nvidia objects are not under $d/bits"; exit 1; }; cd "$d/bits"; sh ./BUILD unsigned; sha256sum -c SHA256SUMS >/dev/null; for k in nvidia nvidia-uvm nvidia-modeset nvidia-drm nvidia-peermem; do cat "$k.ko" > "../$k.ko"; rm -f "$k.ko"; done; rm -f nvidia.o nvidia-uvm.o nvidia-modeset.o nvidia-drm.o nvidia-peermem.o nvidia/nv-interface.o nvidia-modeset/nv-modeset-interface.o; cd "$d"; sha256sum -c bits/SHA256SUMS >/dev/null; for k in nvidia nvidia-uvm nvidia-modeset nvidia-drm nvidia-peermem; do test -s "$k.ko" || { echo "FATAL: $k.ko is empty"; exit 1; }; grep -aqF "vermagic=$abi" "$k.ko" || { echo "FATAL: $k.ko is not built for $abi"; exit 1; }; done; echo "MODFS-LINK-OK 5 modules linked from objects, byte-identical to Canonical SHA256SUMS, vermagic=$abi"'
    probe: 'abi=5.15.0-185-generic; d="/usr/lib/modules/$abi/kernel/nvidia-535"; test -L /lib || exit 1; for k in nvidia nvidia-uvm nvidia-modeset nvidia-drm nvidia-peermem; do test -s "$d/$k.ko" || exit 1; grep -aqF "vermagic=$abi" "$d/$k.ko" || exit 1; done; ( cd "$d" && sha256sum -c bits/SHA256SUMS >/dev/null 2>&1 ) || exit 1; test -x /usr/bin/nvidia-smi || exit 1; ldd /usr/bin/nvidia-smi 2>/dev/null | grep -q "not found" && exit 1; ldconfig -p | grep -q "libcuda\.so\.1 " || exit 1; ldconfig -p | grep -q "libnvidia-ml\.so\.1 " || exit 1; for f in libcuda.so.1 libnvidia-ml.so.1; do test -e "/usr/lib/x86_64-linux-gnu/$f" || exit 1; ldd "/usr/lib/x86_64-linux-gnu/$f" 2>/dev/null | grep -q "not found" && exit 1; done; exit 0'
    probe_note: >-
      WHAT THIS PROVES, and it is less than "the GPU works". It proves the five
      kernel modules exist under /usr/lib/modules/<ABI>/ and NOT under a real
      /lib/modules/<ABI>/; that each carries vermagic=5.15.0-185-generic, so it
      was built for exactly the kernel 11_boot_test.sh installs at pack time;
      that all five are byte-identical to Canonical's own SHA256SUMS after
      surviving squash, overlay stacking and reconciliation -- a per-file
      CONTENT check, which is stronger than V7's (kind, size); and that
      nvidia-smi and libcuda.so.1 are present with every dynamic dependency
      resolvable inside the composed system.
      WHAT IT CANNOT PROVE, on a machine with no NVIDIA GPU: that any module
      LOADS (insmod needs the running kernel, and these are linked UNSIGNED so
      they would be refused under Secure Boot); that nvidia-smi finds a device
      -- it exits non-zero without one, which is why the probe checks its
      linkage and not its exit status; that the driver initialises hardware, or
      that CUDA computes anything. None of that is testable here and none of it
      is claimed.
    provokes: scale
    note: >-
      Ubuntu does NOT ship a prebuilt nvidia .ko. linux-objects ships prebuilt
      OBJECT files plus a link script; the .ko is produced by ld.bfd at install
      time. No compiler and no DKMS are needed, which is what makes this
      feasible against a base with no kernel headers -- but binutils is, and
      linux-objects declares it. The signed path needs
      linux-signatures-nvidia-<abi>, which Depends on linux-image-<abi>; taking
      it would put a kernel inside a module and contradict the design rule that
      the kernel is pack-time scaffolding. So the modules are linked UNSIGNED.

  - name: cuda-runtime
    version: "11.5.1"
    packages:
      - libcudart11.0
      - libcublas11
      - libcufft10
      - libcurand10
      - libcusolver11
      - libcusparse11
      - libnvrtc11.2
      - libnvblas11
      - libnvtoolsext1
    requires:
      - module: nvidia-driver-535
        constraint: ">= 535"
    probe: 'for so in libcudart.so.11.0 libcublas.so.11 libcublasLt.so.11 libcufft.so.10 libcurand.so.10 libcusolver.so.11 libcusparse.so.11 libnvrtc.so.11.2 libnvrtc-builtins.so.11.5 libnvblas.so.11 libnvToolsExt.so.1; do ldconfig -p | grep -q "[[:space:]]$so " || exit 1; f="/usr/lib/x86_64-linux-gnu/$so"; test -e "$f" || exit 1; ldd "$f" 2>/dev/null | grep -q "not found" && exit 1; done; readlink /usr/lib/x86_64-linux-gnu/libcudart.so.11.0 | grep -q "^libcudart\.so\.11\.5\." || exit 1; exit 0'
    probe_note: >-
      Presence and dynamic resolvability of all eleven runtime sonames inside
      the composed system, plus a version assertion that libcudart.so.11.0
      really resolves to the 11.5 series rather than to some other CUDA a
      sibling might carry.
      DELIBERATELY NOT CLAIMED: that any CUDA call succeeds. The runtime
      dlopen()s libcuda.so.1 and then talks to a device; with no GPU there is
      nothing to talk to, and this module ships no executable to try with --
      the runtime packages contain libraries only, and nvcc lives in the
      toolkit this module exists to avoid. A probe that ran a CUDA program and
      reported success would be a false positive of exactly the kind this
      project has found most often.
      The libcuda.so.1 this runtime needs comes from nvidia-driver-535, which
      is why that is a module-level `requires` and not merely a comment.
    provokes: scale
    note: >-
      The CUDA RUNTIME only, deliberately not nvidia-cuda-toolkit. The toolkit
      pulls nvidia-cuda-dev and a compiler: 75 packages and 3 958 MB installed
      against this set's 11 packages and 1 188 MB. A deployed node runs CUDA
      binaries; it does not compile them.
